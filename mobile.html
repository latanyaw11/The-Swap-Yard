<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5ead8;--text:#201e1d;--accent:#c67139;
  --div:rgba(32,30,29,0.16);
  --n100:#f9f4ed;--n200:#eee7db;--n300:#dcd3c4;--n600:#82796a;--n700:#645c50;--n800:#474238;--n900:#2e2b25;
  --a100:#fff2eb;--a200:#ffe1d0;--a300:#ffc6a5;--a600:#b2622d;--a700:#8c491a;--a800:#643312;
  --a2-100:#f0fae1;--a2-200:#e1eecc;--a2-400:#aebf92;--a2-500:#8fa073;--a2-700:#56633f;--a2-800:#3d472b;
  --h:'Caprasimo',system-ui;--body:'Figtree',system-ui;
  --r-md:16px;--r-lg:28px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--body);color:var(--text);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--h);font-weight:400;line-height:1.05;margin:0}
button{font-family:var(--body);cursor:pointer;-webkit-appearance:none;background:none;border:0}
input,textarea,select{font-family:var(--body);-webkit-appearance:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
#statusbar{height:44px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;font-size:13px;font-weight:700;position:relative}
.notch{width:110px;height:28px;background:var(--n900);border-radius:14px;position:absolute;left:50%;transform:translateX(-50%)}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
#tabbar{flex-shrink:0;border-top:1px solid var(--div);background:var(--n100);display:flex;padding-bottom:var(--safe-bot)}
.tab{flex:1;min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0 0;cursor:pointer}
.tab-icon{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.tab-icon.on{background:var(--accent);color:var(--bg)}
.tab-icon.off{background:transparent;color:var(--n700)}
.tab-lbl{font-size:10px}.tab-lbl.on{color:var(--text);font-weight:700}.tab-lbl.off{color:var(--n600)}
#ai-fab{position:fixed;right:16px;bottom:calc(72px + var(--safe-bot));width:54px;height:54px;border-radius:999px;border:0;background:var(--accent);color:var(--bg);font-family:var(--h);font-size:20px;box-shadow:0 8px 24px rgba(198,113,57,.35);z-index:100;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pad{padding:16px 16px 32px}
.chip{display:inline-flex;align-items:center;flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--div);background:transparent;color:var(--n800);transition:all .12s;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.hscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.seg{display:flex;gap:4px;background:var(--n200);padding:4px;border-radius:999px;margin-bottom:16px}
.seg-btn{flex:1;min-height:40px;border:0;border-radius:999px;font-size:13px;font-weight:700;font-family:var(--body);transition:all .12s;color:var(--n700);background:transparent;cursor:pointer}
.seg-btn.on{background:var(--bg);color:var(--text)}
.pill{min-height:50px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:700;font-family:var(--body);border:1.5px solid;transition:all .12s;display:flex;align-items:center;justify-content:center;width:100%;cursor:pointer}
.pill-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.pill-secondary{background:var(--n100);color:var(--n800);border-color:var(--div)}
.pill-sage{background:var(--a2-100);color:var(--a2-800);border-color:var(--a2-400)}
.pill-sm{min-height:42px;font-size:13.5px}
.card{border:1px solid var(--div);background:var(--n100);border-radius:var(--r-lg);overflow:hidden}
.tag{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ph{background:repeating-linear-gradient(45deg,var(--n200) 0 10px,var(--n300) 10px 20px);filter:saturate(.6)contrast(.85)brightness(1.1);display:flex;align-items:center;justify-content:center}
.av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--h);flex-shrink:0}
.section-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--n700);margin-bottom:8px}
.row-list{display:flex;flex-direction:column;border:1px solid var(--div);border-radius:var(--r-lg);overflow:hidden;background:var(--n100)}
.row-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;background:none;border:0;border-bottom:1px solid var(--div);font-family:var(--body);text-align:left;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;width:100%}
.row-btn:last-child{border-bottom:0}
.bubble{padding:11px 12px;font-size:14px;max-width:80%}
.bubble-in{background:var(--n200);border-radius:20px 20px 20px 6px;align-self:flex-start}
.bubble-out{background:var(--a200);border-radius:20px 20px 6px 20px;align-self:flex-end;color:var(--a800)}
.ai-bub{padding:12px;font-size:14px;max-width:86%;line-height:1.55}
.ai-bub.in{background:var(--a2-100);border-radius:20px 20px 20px 6px;align-self:flex-start;color:var(--a2-800)}
.ai-bub.out{background:var(--a200);border-radius:20px 20px 6px 20px;align-self:flex-end;color:var(--a800)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi-card{background:var(--n100);border:1px solid var(--div);border-radius:var(--r-md);padding:12px}
.safety-hero{background:var(--n900);color:#fff;padding:24px 16px}
.listing-hero{position:relative}
.listing-body{margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;position:relative;padding:16px 16px 32px}
.step-dot{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step-line{flex:1;width:2px;background:var(--n300);min-height:22px;margin:0 auto}
.offer-bar{height:10px;border-radius:999px;background:var(--a2-200);overflow:hidden}
.offer-bar-fill{height:100%;border-radius:999px;background:var(--a2-500);transition:width .3s ease}
/* Photo upload */
.photo-zone{border:1.5px dashed var(--a300);background:var(--a100);border-radius:28px;padding:32px 20px;text-align:center;transition:all .15s;display:block;cursor:pointer}
.photo-zone:hover{background:var(--a200)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photo-item{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--n200)}
.photo-item img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:999px;background:rgba(32,30,29,.7);color:#fff;border:0;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-add{aspect-ratio:1;border-radius:16px;border:1.5px dashed var(--n300);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;background:var(--n100);color:var(--n600)}
#toast{position:fixed;top:calc(var(--safe-top)+54px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--n900);color:#fff;border-radius:99px;padding:10px 20px;font-size:13px;font-weight:600;z-index:999;transition:transform .25s ease;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* iOS banner */
#ios-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;padding:20px 16px;background:var(--n900);color:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3)}

/* ── MESSAGING ── */
.msg-thread{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--div);cursor:pointer;background:var(--bg);transition:background .12s}
.msg-thread:hover{background:var(--n200)}
.msg-thread-unread .msg-preview{font-weight:700;color:var(--text)}
.msg-preview{font-size:13px;color:var(--n600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.msg-time{font-size:11px;color:var(--n600);flex-shrink:0}
.chat-screen{display:flex;flex-direction:column;height:100%}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--div);background:var(--bg);flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--div);background:var(--bg);flex-shrink:0;padding-bottom:calc(12px + var(--safe-bot))}
.chat-inp{flex:1;padding:12px 16px;border-radius:999px;border:1.5px solid var(--div);background:var(--n100);font-family:var(--body);font-size:14px;outline:none;transition:border-color .12s}
.chat-inp:focus{border-color:var(--accent)}
.chat-send{width:46px;height:46px;border-radius:999px;background:var(--accent);color:var(--bg);border:0;font-size:18px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-send:disabled{opacity:.45}
.empty-state{text-align:center;padding:48px 24px;color:var(--n600)}
.empty-state div:first-child{font-size:2.5rem;margin-bottom:12px}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="app">
  <div id="statusbar">
    <span id="sb-time">9:41</span>
    <div class="notch"></div>
    <span style="font-size:12px">🔋</span>
  </div>
  <div id="content"></div>
  <button id="ai-fab" onclick="goto(\'ai\')">?</button>
  <div id="tabbar"></div>
</div>

<!-- iOS install -->
<div id="ios-banner">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-family:var(--h);font-size:18px">Install Swap Yard</div>
    <button onclick="document.getElementById('ios-banner').style.display='none'" style="color:rgba(255,255,255,.5);font-size:22px;padding:0">✕</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:12px"><span style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">1</span><span style="font-size:14px;opacity:.85">Tap <strong>Share ⎋</strong> at the bottom of Safari</span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">2</span><span style="font-size:14px;opacity:.85">Tap <strong>Add to Home Screen</strong></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">3</span><span style="font-size:14px;opacity:.85">Tap <strong>Add</strong></span></div>
  </div>
  <div style="text-align:center;font-size:11px;opacity:.4;text-transform:uppercase;letter-spacing:.05em">Safari only · iOS 11.3+</div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const SB_URL = 'https://qkmvznvetsfijwhikiar.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbXZ6bnZldHNmaWp3aGlraWFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzE0ODksImV4cCI6MjA5Njg0NzQ4OX0.uaDC_xktlWLEpbavCdA9vAL56Pd2PN3xhU_SmHBzlZw';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── STATE ─────────────────────────────────────────────────
let currentUser = null;
let screen = 'signin';
let st = {
  authTab:0, filter:'All', radius:'25 mi',
  offerMode:'Cash + trade', cash:80,
  picked:{drill:true}, accepted:false, dealDone:false, saved:false,
  postStep:1, cat:'Goods', cond:'Good', fmv:false, legal:false,
  pays:{Cash:true,Card:true,Barter:true},
  eventFilter:'All', rsvp:{},
  commFilter:'All', commTab:'Feed',
  joined:{}, likes:{},
  plan:'Trader Pro', verified:false, aiQ:null, safetyOpen:'s1',
  activeListing:null, activeCommunity:null,
  _postTitle:'', _postDesc:'', _postPrice:'',
  activeThread:null, threads:[], threadMessages:[], sendingMsg:false,
  liveListings:[], liveEvents:[], liveCommunities:[],
  dashStats:null, commPosts:[], commMembers:[], commChat:[],
  photos:[], uploadingPhotos:false,
};

// ── DEMO DATA ─────────────────────────────────────────────
const DL = [
  {id:'d1',title:'Ryobi 18V drill set, barely used',price_usd:180,type:'goods',mode:'Trade',city:'Durham',emoji:'🔧'},
  {id:'d2',title:'Saturday lawn mowing, any yard',price_usd:null,type:'service',mode:'Barter',city:'Durham',emoji:'🌿'},
  {id:'d3',title:'Mid-century walnut dresser',price_usd:240,type:'goods',mode:'Cash',city:'Cary',emoji:'🪑'},
  {id:'d4',title:'Kids bike, 20 inch',price_usd:45,type:'goods',mode:'Trade',city:'Chapel Hill',emoji:'🚲'},
  {id:'d5',title:'Haircuts, 10 yrs licensed',price_usd:35,type:'service',mode:'Barter',city:'Durham',emoji:'✂️'},
  {id:'d6',title:'Canning jars, case of 24',price_usd:20,type:'goods',mode:'Cash',city:'Raleigh',emoji:'🫙'},
];
const DE = [
  {id:'e1',title:'Triangle Tool & Garden Swap',event_date:'2026-09-22T09:00',event_type:'swap_meet',event_address:'Durham Central Park',cost:'Free'},
  {id:'e2',title:'Six-family block sale, Trinity Park',event_date:'2026-09-24T08:00',event_type:'yard_sale',event_address:'Watts St, Durham',cost:'Free'},
  {id:'e3',title:'RTP Makers Market',event_date:'2026-09-30T11:00',event_type:'pop_up',event_address:'Frontier RTP',cost:'$5'},
  {id:'e4',title:'Full-house estate sale, Cary',event_date:'2026-10-06T07:30',event_type:'estate_sale',event_address:'Kildaire Farm Rd, Cary',cost:'Free'},
];
const DC = [
  {id:'c1',name:'RTP Gardeners',icon:'🌱',member_count:412,post_count:89,category:'gardening'},
  {id:'c2',name:'Triangle Tool Library',icon:'🔧',member_count:288,post_count:54,category:'tools'},
  {id:'c3',name:'Durham Wrenches',icon:'🚗',member_count:176,post_count:31,category:'automotive'},
  {id:'c4',name:'Bull City Vinyl',icon:'🎵',member_count:95,post_count:22,category:'music'},
  {id:'c5',name:'Cary Camp & Paddle',icon:'🏕',member_count:134,post_count:40,category:'outdoors'},
];

// ── INIT ──────────────────────────────────────────────────

// Pre-store demo data in listing map
var _listingMap = {};
function _storeListing(l) { if(l&&l.id) _listingMap[l.id]=l; return l; }
function openListing(id) { var l=_listingMap[id]; if(l){st.activeListing=l;goto('listing');} }
function initDemoMap() {
  DL.forEach(function(l){ _listingMap[l.id]=l; });
}

window.addEventListener('DOMContentLoaded', async function() {
  initDemoMap();
  clockTick();
  setInterval(clockTick, 30000);
  setupPWA();
  try {
    var r = await sb.auth.getSession();
    if (r.data && r.data.session) {
      currentUser = r.data.session.user;
      await loadAll();
      goto('home');
    } else {
      goto('signin');
    }
  } catch(e) { goto('signin'); }
  sb.auth.onAuthStateChange(async function(ev, session) {
    currentUser = session ? session.user : null;
    if (ev === 'SIGNED_IN') { await loadAll(); goto('home'); }
    if (ev === 'SIGNED_OUT') { st.liveListings=[]; st.liveEvents=[]; st.liveCommunities=[]; goto('signin'); }
  });
});

function clockTick() {
  var d = new Date();
  var el = document.getElementById('sb-time');
  if (el) el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function loadAll() {
  try {
    // Load each independently so one failure doesn't block others
    var lRes = await sb.from('listings').select('*').limit(20);
    if (lRes.data && lRes.data.length) { st.liveListings = lRes.data; lRes.data.forEach(function(l){ _listingMap[l.id]=l; }); }

    var eRes = await sb.from('events').select('*').order('event_date',{ascending:true}).limit(20);
    if (eRes.data && eRes.data.length) st.liveEvents = eRes.data;

    var cRes = await sb.from('communities').select('*').limit(20);
    if (cRes.data && cRes.data.length) st.liveCommunities = cRes.data;
    
    // unused assignment suppressor
    void(0);
    if (currentUser) {
      var rsvps = await sb.from('event_rsvps').select('event_id').eq('user_id',currentUser.id);
      var mems  = await sb.from('community_members').select('community_id').eq('user_id',currentUser.id);
      if (rsvps.data) rsvps.data.forEach(function(r){ st.rsvp[r.event_id]=true; });
      if (mems.data)  mems.data.forEach(function(m){ st.joined[m.community_id]=true; });
    }
  } catch(e) { console.warn('loadAll',e); }
}

// ── ROUTING ───────────────────────────────────────────────
var TABS = ['home','browse','post','community','dash'];
function goto(s) {
  screen = s;
  var c = document.getElementById('content');
  if (c) c.scrollTop = 0;
  if (s === 'chats' && !st.activeThread && currentUser) {
    loadInbox().then(function(){ render(); });
  }
  render();
}
function setState(upd) {
  var v = typeof upd === 'function' ? upd(st) : upd;
  Object.assign(st, v);
  render();
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  var showTabs = screen !== 'signin';
  var showAi   = screen !== 'signin' && screen !== 'ai';
  document.getElementById('ai-fab').style.display = showAi ? 'flex' : 'none';
  document.getElementById('tabbar').style.display  = showTabs ? 'flex' : 'none';
  var userEl = document.getElementById('sb-user');
  // renderTabbar
  var tabs = [
    {k:'home',     l:'Home',   svg:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>'},
    {k:'browse',   l:'Browse', svg:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'},
    {k:'post',     l:'List',   svg:'<path d="M5 12h14"/><path d="M12 5v14"/>'},
    {k:'community',l:'Community',svg:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'},
    {k:'dash',     l:'Yard',   svg:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>'},
  ];
  var activeTab = TABS.indexOf(screen) >= 0 ? screen : '';
  document.getElementById('tabbar').innerHTML = tabs.map(function(t) {
    var on = activeTab === t.k;
    var ic = '<span class="tab-icon '+(on?'on':'off')+'"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">'+t.svg+'</svg></span>';
    var lb = '<span class="tab-lbl '+(on?'on':'off')+'">'+t.l+'</span>';
    return '<button class="tab" data-k="'+t.k+'">'+ic+lb+'</button>';
  }).join('');
  document.getElementById('tabbar').querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){ goto(this.getAttribute('data-k')); });
  });
  // render screen
  var fn = SCREENS[screen] || SCREENS['home'];
  document.getElementById('content').innerHTML = fn();
  afterRender();
}

function afterRender() {
  var r = document.getElementById('cash-range');
  if (r) {
    r.value = st.cash;
    r.oninput = function(e) {
      st.cash = Number(e.target.value);
      var cl = document.getElementById('cash-lbl');
      if (cl) cl.textContent = '$'+st.cash;
      updateOfferBar();
    };
  }
}

// ── HELPERS ───────────────────────────────────────────────
function setAiQ(el){ setState({aiQ:decodeURIComponent(el.getAttribute('data-q'))}); }
function handleNav(el) {
  var k = el.getAttribute('data-goto');
  if (k) goto(k);
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2800);
}
function timeAgo(d) {
  var diff = Math.floor((new Date()-new Date(d))/1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}
function modeColor(m) {
  return m==='Trade'?'background:var(--a2-200);color:var(--a2-800)':m==='Barter'?'background:var(--a200);color:var(--a800)':'background:var(--n200);color:var(--n800)';
}
function modeTg(m) {
  var bg = m==='Trade'?'var(--a2-200)':m==='Barter'?'var(--a200)':'var(--n200)';
  var fg = m==='Trade'?'var(--a2-800)':m==='Barter'?'var(--a800)':'var(--n800)';
  return tg(m, bg, fg);
}
function av(init,bg,fg,sz) { sz=sz||44; return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;background:'+bg+';color:'+fg+';font-size:'+(sz*.3)+'px">'+init+'</span>'; }
function tg(lbl,bg,fg)     { return '<span class="tag" style="background:'+bg+';color:'+fg+'">'+esc(lbl)+'</span>'; }
function chip(lbl,on,fn)   { return '<button class="chip'+(on?' on':'')+'" onclick="\'+fn+\'">'+lbl+'</button>'; }
function seg(lbls,act,fn) {
  return '<div class="seg">'+lbls.map(function(l,i){ return '<button class="seg-btn'+(act===i?' on':'')+'" onclick="\'+fn+\'(\'+i+\')">'+l+'</button>'; }).join('')+'</div>';
}
function ph(h,emoji) {
  return '<div class="ph" style="height:'+h+'px;font-size:2rem">'+( emoji||'')+'</div>';
}
function listingImg(l,h) {
  if (l && (l.cover_image||(l.images&&l.images[0]))) {
    return '<img src="'+(l.cover_image||(l.images&&l.images[0]))+'" style="width:100%;height:'+h+'px;object-fit:cover" loading="lazy">';
  }
  return ph(h, l&&l.emoji ? l.emoji : '');
}
function backBtn(fn) {
  return '<button onclick="\'+fn+\'" style="width:44px;height:44px;border-radius:999px;border:1px solid var(--div);background:var(--n100);font-size:17px;margin-bottom:12px;cursor:pointer">←</button>';
}
function updateOfferBar() {
  var hasCash  = st.offerMode !== 'Trade only';
  var hasTrade = st.offerMode !== 'Cash only';
  var goods = hasTrade ? ((st.picked.drill?35:0)+(st.picked.chair?40:0)+(st.picked.hours?90:0)) : 0;
  var total = (hasCash ? st.cash : 0) + goods;
  var pct   = Math.min(100,Math.round((total/180)*100));
  var bar = document.getElementById('offer-bar-fill');
  var tot = document.getElementById('offer-total');
  var nte = document.getElementById('offer-note');
  if (bar) bar.style.width = pct+'%';
  if (tot) tot.textContent = '$'+total+' of value';
  if (nte) nte.textContent = total>=180 ? 'Meets the asking price.' : 'Sits $'+(180-total)+' under asking.';
}

// ── LISTINGS (get live or demo) ───────────────────────────
function getListings() {
  // Show real listings first, pad with demo if fewer than 6
  var live = st.liveListings || [];
  if (live.length >= 6) return live;
  // Filter demo items that don't clash with real listing IDs
  var liveIds = live.map(function(l){ return l.id; });
  var pad = DL.filter(function(d){ return liveIds.indexOf(d.id) === -1; });
  return live.concat(pad).slice(0, 12);
}
function getEvents() {
  var live = st.liveEvents || [];
  if (live.length >= 4) return live;
  var liveIds = live.map(function(e){ return e.id; });
  var pad = DE.filter(function(d){ return liveIds.indexOf(d.id) === -1; });
  return live.concat(pad);
}
function getCommunities() {
  var live = st.liveCommunities || [];
  if (live.length >= 5) return live;
  var liveIds = live.map(function(c){ return c.id; });
  var pad = DC.filter(function(d){ return liveIds.indexOf(d.id) === -1; });
  return live.concat(pad);
}

async function startConversation(listing) {
  if (!currentUser) { toast("Sign in to message sellers"); goto("signin"); return; }
  if (!listing || !listing.id) { toast("Select a listing first"); return; }
  var sellerId = listing.user_id;
  if (!sellerId) { toast("Cannot identify seller"); return; }
  if (sellerId === currentUser.id) { toast("This is your own listing"); return; }
  var threadId = listing.id + "_" + [currentUser.id, sellerId].sort().join("_");
  st.activeThread = { id: threadId, listing: listing, otherId: sellerId };
  st.threadMessages = [];
  await loadThreadMessages(threadId, listing.id);
  goto("chats");
}

async function loadThreadMessages(threadId, listingId) {
  try {
    var res = await sb.from("messages").select("*")
      .eq("listing_id", listingId)
      .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
      .order("created_at", {ascending:true}).limit(50);
    st.threadMessages = res.data || [];
  } catch(e) { st.threadMessages = []; }
}

async function loadInbox() {
  if (!currentUser) return;
  try {
    var res = await sb.from("messages")
      .select("*, listing:listings(title,cover_image,emoji)")
      .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
      .order("created_at", {ascending:false}).limit(40);
    if (res.data) {
      var seen = {};
      st.threads = res.data.filter(function(m) {
        if (seen[m.listing_id]) return false;
        seen[m.listing_id] = true;
        return true;
      });
    }
  } catch(e) { st.threads = []; }
}

async function sendChatMsg() {
  var inp = document.getElementById("chat-msg-inp");
  if (!inp || !inp.value.trim()) return;
  if (!currentUser || !st.activeThread) return;
  var body = inp.value.trim();
  var thread = st.activeThread;
  inp.value = "";
  var tempMsg = { id:"temp_"+Date.now(), sender_id:currentUser.id, receiver_id:thread.otherId, listing_id:thread.listing.id, body:body, created_at:new Date().toISOString(), _temp:true };
  st.threadMessages = st.threadMessages.concat([tempMsg]);
  render();
  try {
    await sb.from("messages").insert({ sender_id:currentUser.id, receiver_id:thread.otherId, listing_id:thread.listing.id, thread_id:thread.id, body:body });
    await loadThreadMessages(thread.id, thread.listing.id);
  } catch(e) { toast("Send failed"); st.threadMessages = st.threadMessages.filter(function(m){ return !m._temp; }); }
  render();
  setTimeout(function(){ var el=document.getElementById("chat-msgs"); if(el) el.scrollTop=el.scrollHeight; }, 50);
}

async function openThread(listingId) {
  if (!currentUser) return;
  var listing = _listingMap[listingId];
  if (!listing) {
    var tm = st.threads.find(function(m){ return m.listing_id===listingId; });
    if (tm && tm.listing) listing = Object.assign({id:listingId}, tm.listing);
  }
  if (!listing) { toast("Listing not found"); return; }
  var tm = st.threads.find(function(m){ return m.listing_id===listingId; });
  var otherId = tm ? (tm.sender_id===currentUser.id ? tm.receiver_id : tm.sender_id) : null;
  var threadId = listingId + "_" + (otherId ? [currentUser.id, otherId].sort().join("_") : currentUser.id);
  st.activeThread = { id:threadId, listing:listing, otherId:otherId };
  st.threadMessages = [];
  await loadThreadMessages(threadId, listingId);
  render();
  setTimeout(function(){ var el=document.getElementById("chat-msgs"); if(el) el.scrollTop=el.scrollHeight; }, 100);
}

function timeStr(iso) {
  if (!iso) return "";
  var d = new Date(iso), now = new Date(), diff = now - d;
  if (diff < 60000) return "now";
  if (diff < 3600000) return Math.floor(diff/60000)+"m";
  if (diff < 86400000) return d.getHours()+":"+(d.getMinutes()+"").padStart(2,"0");
  return (d.getMonth()+1)+"/"+d.getDate();
}

// ── PHOTO UPLOAD ─────────────────────────────────────────
async function handlePhotos(files) {
  if(!files||!files.length) return;
  if(!currentUser){toast('Sign in to upload photos');return;}
  var arr=Array.from(files).filter(function(f){ return f.type.startsWith('image/')&&f.size<=5242880; });
  if(!arr.length){toast('Images only, max 5MB each');return;}
  var remaining=5-st.photos.length;
  arr=arr.slice(0,remaining);
  setState({uploadingPhotos:true});
  toast('Uploading '+arr.length+' photo'+(arr.length>1?'s':'')+'…');
  var results=[];
  for(var i=0;i<arr.length;i++){
    var file=arr[i];
    var ext=file.name.split('.').pop()||'jpg';
    var path=currentUser.id+'/'+Date.now()+'_'+i+'.'+ext;
    try {
      var up=await sb.storage.from('listing-images').upload(path,file,{upsert:false,contentType:file.type});
      if(up.error){toast('Upload failed: '+up.error.message);continue;}
      var urlData=sb.storage.from('listing-images').getPublicUrl(path);
      results.push({url:urlData.data.publicUrl,path:path});
    } catch(err){toast('Upload error');}
  }
  setState(function(s){ return {photos:s.photos.concat(results),uploadingPhotos:false}; });
  if(results.length) toast(results.length+' photo'+(results.length>1?'s':'')+' uploaded ✓');
}
async function delPhoto(idx){
  var p=st.photos[idx];
  if(!p)return;
  try{await sb.storage.from('listing-images').remove([p.path]);}catch(e){}
  setState(function(s){ var a=s.photos.slice();a.splice(idx,1);return {photos:a}; });
}

  var on = btn.getAttribute('data-on') === '1';
  var newOn = !on;
  st.pays[p] = newOn;
  btn.setAttribute('data-on', newOn ? '1' : '0');
  btn.style.background = newOn ? 'var(--a2-100)' : 'transparent';
  btn.style.color = newOn ? 'var(--a2-800)' : 'var(--n800)';
  btn.style.borderColor = newOn ? 'var(--a2-400)' : 'var(--div)';
}

function doFmv() {
  st.fmv = true;
  var sub = document.getElementById('fmv-sub');
  var btn = document.getElementById('fmv-btn');
  var res = document.getElementById('fmv-result');
  if (sub) sub.textContent = 'Based on comparable swaps';
  if (btn) { btn.textContent = '✓ Done'; }
  if (res) res.style.display = 'block';
}


// ── STATE MUTATORS ────────────────────────────────────────
function setAuthTab(i)     { setState({authTab:i}); }
function setFilter(f)      { setState({filter:f}); }
function setRadius(r)      { setState({radius:r}); }
function setEventFilter(f) { setState({eventFilter:f}); }
function setCommFilter(f)  { setState({commFilter:f}); }
function setCommTab(i)     { setState({commTab:['Feed','Chat','Members'][i]}); }
function setOfferMode(i)   { setState({offerMode:['Cash only','Trade only','Cash + trade'][i]}); }
function setPostStep(i)    { setState({postStep:i+1}); }
function setCond(i)        { setState({cond:['New','Good','Rough'][i]}); }
function toggleSave()      { setState({saved:!st.saved}); }
function toggleLegal()     { setState({legal:!st.legal}); }
function togglePick(k)     { setState(function(s){ var p=Object.assign({},s.picked);p[k]=!p[k];return {picked:p}; }); updateOfferBar(); }
function togglePay(k)      { setState(function(s){ var p=Object.assign({},s.pays);p[k]=!p[k];return {pays:p}; }); }
function toggleSafety(k)   { setState({safetyOpen:st.safetyOpen===k?null:k}); }

// ── PWA ───────────────────────────────────────────────────
function setupPWA(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
  if(isStandalone) return;
  if(isIOS){
    var shown=sessionStorage.getItem('ios-shown');
    if(!shown){setTimeout(function(){ var b=document.getElementById('ios-banner');if(b)b.style.display='block';sessionStorage.setItem('ios-shown','1'); },3000);}
  }
  if('serviceWorker'in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
}
