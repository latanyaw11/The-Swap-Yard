[build]
  publish   = "."
  command   = "echo 'Static site - no build step'"
  functions = "netlify/functions"

[dev]
  port = 8888

# ── REDIRECTS ──────────────────────────────────────────────

# Short URLs
[[redirects]]
  from   = "/app"
  to     = "/mobile.html"
  status = 301

[[redirects]]
  from   = "/mobile"
  to     = "/mobile.html"
  status = 301

[[redirects]]
  from   = "/vendor"
  to     = "/mobile.html"
  status = 301

[[redirects]]
  from   = "/legal"
  to     = "/terms.html"
  status = 301

[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from   = "/share-target"
  to     = "/.netlify/functions/share-target"
  status = 200

# ── CACHE HEADERS ──────────────────────────────────────────

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mobile.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── SECURITY HEADERS ───────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── SCHEDULED FUNCTIONS ────────────────────────────────────

[functions."price-drop-alerts"]
  schedule = "0 9 * * *"  # Run daily at 9am UTC

[functions."escrow"]
  schedule = "0 * * * *"  # Hourly — sweeps escrows whose 24h auto-release window has passed

